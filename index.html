<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>メロディ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
/* layout: 上に短い説明、下にメロディーカードの格子。カードは「絵・名前・音の形・イメージ・使う場面・ボタン」 */
:root{
  --bg:#F3F7F6; --card:#FFFFFF; --ink:#26332F; --sub:#5D6E69; --line:#D8E3E0;
  --accent:#2F8F7B; --accent-ink:#FFFFFF; --soft:#E3F1ED; --note:#B9CFC9;
  --font:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141B19; --card:#1D2725; --ink:#E6EEEB; --sub:#9DB0AA; --line:#2E3C39;
  --accent:#5CC2AB; --accent-ink:#0F1715; --soft:#233531; --note:#43605A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141B19; --card:#1D2725; --ink:#E6EEEB; --sub:#9DB0AA; --line:#2E3C39;
  --accent:#5CC2AB; --accent-ink:#0F1715; --soft:#233531; --note:#43605A; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);margin:0;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px));touch-action:manipulation;-webkit-user-select:none;user-select:none;line-height:1.7}
rt{font-size:.5em;color:var(--sub)}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:1.5rem;margin:0;text-wrap:balance}
.lead{margin:0;color:var(--sub);max-width:65ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.playing{border-color:var(--accent)}
.head{display:flex;align-items:center;gap:14px}
.pic{width:64px;height:64px;flex:none;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.pic svg{width:44px;height:44px}
.name{font-size:1.3rem;font-weight:700;margin:0}
.meta{font-size:.85rem;color:var(--sub);margin:0;font-variant-numeric:tabular-nums}
.roll{width:100%;height:auto;display:block;background:var(--soft);border-radius:8px}
.roll rect{fill:var(--note)} .roll rect.on{fill:var(--accent)}
.roll line{stroke:var(--accent);stroke-width:1.5}
.label{font-size:.8rem;font-weight:700;color:var(--accent);letter-spacing:.06em;margin:0}
.text{margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
button{font-family:inherit;font-size:1rem;font-weight:700;min-height:48px;min-width:48px;padding:0 18px;border-radius:10px;border:2px solid var(--accent);cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.play{background:var(--accent);color:var(--accent-ink);flex:1}
.copy{background:var(--card);color:var(--accent)}
.opt{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.opt.col{flex-direction:column;align-items:stretch;gap:6px}
.opt label{font-size:.85rem;font-weight:700;color:var(--accent)}
.opt input[type=text],.opt textarea,.opt select{flex:1;min-width:8em;min-height:48px;font:inherit;font-size:16px;padding:0 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);-webkit-user-select:text;user-select:text}
.opt textarea{padding:10px 12px;resize:vertical;line-height:1.6}
.opt select{padding-right:8px}
.opt input::placeholder,.opt textarea::placeholder{color:var(--sub);opacity:1}
.opt input[type=text]:focus-visible,.opt textarea:focus-visible,.opt select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.opt .chk{display:flex;align-items:center;gap:8px;min-height:48px;font-size:.95rem;color:var(--ink)}
.opt input[type=checkbox]{width:28px;height:28px;accent-color:var(--accent)}
.msg{font-size:.85rem;color:var(--sub);min-height:1.4em;margin:0}
.foot{font-size:.85rem;color:var(--sub);margin:0;max-width:70ch}
</style>
</head>
<body>

<div class="wrap">
  <h1>メロディ</h1>
  <p class="lead">いろいろな<ruby>場<rt>ば</rt></ruby><ruby>面<rt>めん</rt></ruby>で<ruby>使<rt>つか</rt></ruby>える、メロディーや<ruby>効<rt>こう</rt></ruby><ruby>果<rt>か</rt></ruby><ruby>音<rt>おん</rt></ruby>を<ruby>集<rt>あつ</rt></ruby>めたよ。「きいてみる」をおすと<ruby>鳴<rt>な</rt></ruby>るよ。<ruby>鳴<rt>な</rt></ruby>っているときにもう<ruby>一<rt>いち</rt></ruby><ruby>度<rt>ど</rt></ruby>おすと、とまるよ。</p>
  <div class="grid" id="grid"></div>
  <div class="row">
    <button class="copy" type="button" id="copy-all"><ruby>全部<rt>ぜんぶ</rt></ruby>の<ruby>部<rt>ぶ</rt></ruby><ruby>品<rt>ひん</rt></ruby>をコピー</button>
    <p class="msg" id="copy-all-msg" aria-live="polite" style="align-self:center"></p>
  </div>
  <p class="foot">「<ruby>部<rt>ぶ</rt></ruby><ruby>品<rt>ひん</rt></ruby>をコピー」をおすと、<ruby>音<rt>おと</rt></ruby>を<ruby>鳴<rt>な</rt></ruby>らすプログラムとメロディーのデータが、ひとまとめにコピーされるよ。ほかのタイマーを<ruby>作<rt>つく</rt></ruby>っている<ruby>会話<rt>かいわ</rt></ruby>に<ruby>貼<rt>は</rt></ruby>って、「これを<ruby>組<rt>く</rt></ruby>みこんで」とたのんでね。</p>
</div>

const TONE_NAME = {pinpon:'チャイムの{音|おと}', funya:'ふにゃふにゃした{音|おと}', kankan:'{踏|ふみ}{切|きり}の{音|おと}', brass:'ラッパの{音|おと}', musicbox:'オルゴールの{音|おと}', soft:'やわらかい{音|おと}', sine:'すんだ{音|おと}', square:'ピコピコした{音|おと}', bell:'かねの{音|おと}', airy:'ふんわりした{音|おと}', lead:'ピコピコした{音|おと}＋リズム', wood:'{木|き}の{音|おと}', drum:'{太|たい}{鼓|こ}の{音|おと}'};

// ---- 音を鳴らす ----
let ctx = null, bus = null, current = null;
function unlock(){
  // iPhoneのマナーモード（消音スイッチ）でも鳴るように、音楽再生あつかいにする
  try { if(navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}
  if(!window.__silentAudio){
    try {
      // 0.1秒の無音WAVをくりかえし再生して、iOSの音の出し方を「メディア」に切りかえる
      const n = 4410, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
      const w = (o, s) => { for(let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
      w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, 44100, true); v.setUint32(28, 88200, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
      w(36, 'data'); v.setUint32(40, n * 2, true);
      const a = new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })));
      a.loop = true; a.setAttribute('playsinline', ''); a.volume = 0.01;
      const p = a.play(); if(p && p.catch) p.catch(() => {});
      window.__silentAudio = a;
    } catch(e){}
  } else if(window.__silentAudio.paused){
    const p = window.__silentAudio.play(); if(p && p.catch) p.catch(() => {});
  }
  if(!ctx){ const AC = window.AudioContext || window.webkitAudioContext; ctx = new AC(); }
  if(ctx.state !== 'running') ctx.resume();
}
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function partial(type, f, t, peak, decay, out, filter){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
  o.connect(g);
  if(filter){ const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=filter; g.connect(lp); lp.connect(out); }
  else g.connect(out);
  o.start(t); o.stop(t + decay + 0.05);
}
let noiseBuf = null;
function noise(t, peak, decay, center, out){
  if(!noiseBuf){
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const s = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
  s.buffer = noiseBuf; bp.type = 'bandpass'; bp.frequency.value = center; bp.Q.value = .8;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
  s.connect(bp); bp.connect(g); g.connect(out);
  s.start(t); s.stop(t + decay + 0.05);
}
function drumHit(f, t, peak, decay, out){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(f * 1.6, t);
  o.frequency.exponentialRampToValueAtTime(f, t + 0.04);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
  o.connect(g); g.connect(out);
  o.start(t); o.stop(t + decay + 0.05);
}
// 少しずらした音を重ねて、ひろがりを出す
function layered(type, f, t, peak, attack, hold, release, out, cents, filter){
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + attack);
  g.gain.setValueAtTime(peak, t + Math.max(attack, hold));
  g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(attack, hold) + release);
  let dest = out;
  if(filter){ const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = filter; lp.connect(out); dest = lp; }
  g.connect(dest);
  cents.forEach(c => {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = c;
    o.connect(g); o.start(t); o.stop(t + Math.max(attack, hold) + release + .05);
  });
}
function voice(tone, m, t, dur, out, v = 1, nChord = 1){
  const f = hz(m);
  const k = v / Math.sqrt(nChord);
  if(tone === 'pinpon'){
    const d = Math.max(1.1, dur * 1.3);
    partial('sine', f, t, .3 * k, d, out);
    partial('triangle', f, t, .05 * k, d * .7, out);
    partial('sine', f * 2, t, .06 * k, .4, out);
    return;
  }
  if(tone === 'funya'){
    const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
    o.type = 'sawtooth'; lp.type = 'lowpass'; lp.Q.value = 4;
    o.frequency.setValueAtTime(f * 1.03, t);
    o.frequency.exponentialRampToValueAtTime(f * .97, t + dur * .9);
    // わうわう：フィルターを開けてから閉じる
    lp.frequency.setValueAtTime(400, t);
    lp.frequency.linearRampToValueAtTime(1600, t + Math.min(.15, dur * .3));
    lp.frequency.linearRampToValueAtTime(600, t + dur * .9);
    if(dur > 1){ // 最後はゆらゆら
      const l = ctx.createOscillator(), lg = ctx.createGain();
      l.frequency.value = 6; lg.gain.value = f * .03; l.connect(lg); lg.connect(o.frequency);
      l.start(t + .2); l.stop(t + dur + .1);
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(.16 * k, t + .03);
    g.gain.setValueAtTime(.16 * k, t + dur * .85);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(lp); lp.connect(g); g.connect(out);
    o.start(t); o.stop(t + dur + .05);
    return;
  }
  if(tone === 'kankan'){
    partial('sine', f, t, .22 * k, .5, out);
    partial('sine', f * 2.4, t, .1 * k, .3, out);
    partial('sine', f * 3.9, t, .05 * k, .15, out);
    partial('square', f, t, .03 * k, .2, out, 3000);
    return;
  }
  if(tone === 'brass'){
    layered('sawtooth', f, t, .07 * k, .03, dur * .8, .2, out, [-5, 5], 2000);
    layered('square', f / 2, t, .03 * k, .03, dur * .8, .2, out, [0], 900);
    return;
  }
  if(tone === 'musicbox'){
    partial('sine', f, t, .22 * k, 1.4, out);
    partial('triangle', f * 2, t, .05 * k, .6, out);
    partial('sine', f * 4, t, .04 * k, .25, out);
    return;
  }
  if(tone === 'airy'){
    layered('triangle', f, t, .2 * k, .02, dur * .7, dur * .9 + .4, out, [-7, 7]);
    layered('sine', f, t, .12 * k, .02, dur * .5, dur + .3, out, [0]);
    layered('sine', f * 2, t, .03 * k, .01, .02, .35, out, [0]);
    return;
  }
  if(tone === 'pad'){
    layered('triangle', f, t, .07 * k, .35, dur * .85, .9, out, [-9, 0, 9], 1800);
    return;
  }
  if(tone === 'chime'){
    partial('sine', f, t, .12 * v, 1.2, out);
    partial('sine', f * 3, t, .025 * v, .4, out);
    return;
  }
  if(tone === 'lead'){
    layered('square', f, t, .05 * k, .006, dur * .55, .12, out, [-8, 8], 2600);
    layered('triangle', f / 2, t, .08 * k, .006, dur * .55, .12, out, [0]);
    return;
  }
  if(tone === 'bass'){
    layered('triangle', f, t, .3 * v, .005, dur * .45, .1, out, [0]);
    layered('square', f, t, .03 * v, .005, dur * .3, .08, out, [0], 700);
    return;
  }
  if(tone === 'hat'){ noise(t, .06 * v, .045, 8000, out); return; }
  if(tone === 'stab'){
    layered('sawtooth', f, t, .05 * k, .01, dur * .25, .15, out, [-6, 6], 1500);
    return;
  }
  if(tone === 'drum'){
    const k = v / Math.sqrt(nChord);
    if(dur > 1){ // どーん：のびる音
      drumHit(f, t, .45 * k, dur * .9, out);
      partial('triangle', f, t, .12 * k, dur * 1.1, out);
      if(m < 50) noise(t, .25 * v, 1.6, 900, out);
    } else {
      const d = Math.max(.1, Math.min(dur * .6, .35));
      drumHit(f, t, .38 * k, d, out);
      noise(t, .12 * k, Math.min(d, .09), 2400, out);
    }
    return;
  }
  if(tone === 'soft'){ partial('triangle', f, t, .32, dur * 1.4 + .25, out); }
  else if(tone === 'sine'){ partial('sine', f, t, .22, Math.min(dur * 1.3, .5) + .08, out); }
  else if(tone === 'square'){ partial('square', f, t, .07, dur * 1.2 + .15, out, 1800); }
  else if(tone === 'bell'){
    partial('sine', f, t, .28, 2.4, out);
    partial('sine', f * 2.76, t, .08, .9, out);
    partial('sine', f * 5.4, t, .03, .4, out);
  } else if(tone === 'wood'){
    partial('sine', f, t, .38, .4, out);
    partial('sine', f * 4, t, .06, .09, out);
  }
}
// メロディーを鳴らす本体（画面の表示とは関係なし。コピー用の部品にもそのまま入る）
function startMelody(mel){
  unlock(); // タップの中で最初に呼ぶ（iPad対策）
  if(bus){ const b = bus; b.gain.setTargetAtTime(0, ctx.currentTime, .03); setTimeout(()=>b.disconnect(), 300); }
  bus = ctx.createGain(); bus.gain.value = .9; bus.connect(ctx.destination);
  const spb = 60 / mel.bpm, t0 = ctx.currentTime + .06;
  if(mel.echo){ // やまびこのようなひびき
    const d = ctx.createDelay(1), fb = ctx.createGain(), wet = ctx.createGain(), lp = ctx.createBiquadFilter();
    d.delayTime.value = spb * .75; fb.gain.value = .3; wet.gain.value = .28; lp.type = 'lowpass'; lp.frequency.value = 2500;
    bus.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(wet); wet.connect(ctx.destination);
    setTimeout(() => { try { d.disconnect(); wet.disconnect(); } catch(e){} }, 12000);
  }
  (mel.layers || []).forEach(L => {
    const lg = ctx.createGain(); lg.gain.value = L.gain; lg.connect(bus);
    let lt = 0;
    L.notes.forEach(([m, b, v = 1]) => {
      if(m !== null){ const ms = [].concat(m); ms.forEach(x => voice(L.tone, x, t0 + lt, b * spb, lg, v, ms.length)); }
      lt += b * spb;
    });
  });
  let t = 0; const times = [];
  mel.notes.forEach(([m, b, v = 1]) => {
    times.push(t0 + t);
    if(m !== null){ const ms = [].concat(m); ms.forEach(x => voice(mel.tone, x, t0 + t, b * spb, bus, v, ms.length)); }
    t += b * spb;
  });
  return { t0, times, total: t };
}

// ---- よみあげ（端末に入っている声を使う） ----
// iPhone/iPadで「拡張」「プレミアム」の声をダウンロードしていれば、それを上にならべて、さいしょにえらぶ
const VOICE_KEY = 'melody-tts-voice';
let jaVoices = [], jaVoice = null, voiceTries = 0;
function voiceScore(v){
  const s = v.name + ' ' + v.voiceURI;
  return (/premium|プレミアム/i.test(s) ? 4 : 0)
       + (/enhanced|拡張|高品質|neural|natural/i.test(s) ? 3 : 0)
       + (v.localService ? 1 : 0);
}
function loadVoice(){
  try {
    const vs = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
    vs.sort((a, b) => voiceScore(b) - voiceScore(a));
    jaVoices = vs;
    let saved = null; try { saved = localStorage.getItem(VOICE_KEY); } catch(e){}
    jaVoice = vs.find(v => v.voiceURI === saved) || vs[0] || null;
    fillVoiceSelect();
    // iOSでは声のリストがあとから届くことがあるので、少しのあいだ見なおす
    if(!vs.length && voiceTries++ < 10) setTimeout(loadVoice, 300);
  } catch(e){}
}
function fillVoiceSelect(){
  const sel = document.getElementById('tts-voice');
  if(!sel) return;
  sel.innerHTML = '';
  if(!jaVoices.length){
    const o = document.createElement('option'); o.textContent = 'にほんごのこえが みつからないよ'; o.disabled = true; o.selected = true;
    sel.appendChild(o); return;
  }
  jaVoices.forEach(v => {
    const o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = (voiceScore(v) >= 3 ? '★ ' : '') + v.name;
    if(jaVoice && v.voiceURI === jaVoice.voiceURI) o.selected = true;
    sel.appendChild(o);
  });
}
if('speechSynthesis' in window){
  loadVoice();
  try { speechSynthesis.addEventListener('voiceschanged', loadVoice); } catch(e){}
}
function sayText(text, onEnd){ // タップの中で同期的に呼ぶ（iPad対策）
  if(!('speechSynthesis' in window)){ if(onEnd) onEnd(); return false; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; if(jaVoice) u.voice = jaVoice;
    u.rate = .95; u.pitch = 1;
    if(onEnd){ u.onend = onEnd; u.onerror = onEnd; }
    speechSynthesis.speak(u);
    return true;
  } catch(e){ if(onEnd) onEnd(); return false; }
}
function nameText(name){
  return /(さん|くん|君|ちゃん|先生|様)$/.test(name) ? name : name + 'さん';
}

function stopPlaying(){
  if(current){ const id = current.mel.id; stopAll(); resetCard(id); current = null; }
}
function stopAll(){
  try { if('speechSynthesis' in window) speechSynthesis.cancel(); } catch(e){}
  if(bus && ctx){ const b = bus; b.gain.setTargetAtTime(0, ctx.currentTime, .03); setTimeout(() => b.disconnect(), 300); bus = null; }
}
function resetCard(id){
  const el = document.querySelector(`.card[data-id="${id}"]`);
  if(!el) return;
  el.classList.remove('playing');
  el.querySelectorAll('rect').forEach(r => r.classList.remove('on'));
  el.querySelector('line').setAttribute('x1', 6); el.querySelector('line').setAttribute('x2', 6);
  el.querySelector('.play').textContent = 'きいてみる';
}
function play(mel){
  if(current && current.mel.id === mel.id){ // 鳴っているときにおすと、とめる
    stopAll(); resetCard(mel.id); current = null; return;
  }
  if(current) resetCard(current.mel.id);
  const el = document.querySelector(`.card[data-id="${mel.id}"]`);
  const r = startMelody(mel);
  current = { mel, t0: r.t0, times: r.times, total: r.total };
  if(mel.voice){
    const name = el.querySelector('.name-in').value.trim();
    if(el.querySelector('.voice-on').checked && name){
      sayText(nameText(name) + '、ハッピーバースデー！');
      if(bus){ // こえが聞こえやすいように、はじめは音楽を小さく
        const n = ctx.currentTime;
        bus.gain.cancelScheduledValues(n);
        bus.gain.setValueAtTime(.45, n);
        bus.gain.linearRampToValueAtTime(.9, n + 4.5);
      }
    }
  }
  el.classList.add('playing');
  el.querySelector('.play').textContent = 'とめる';
  requestAnimationFrame(tick);
}
function tick(){
  if(!current) return;
  const { mel, t0, times, total } = current;
  const el = document.querySelector(`.card[data-id="${mel.id}"]`);
  const now = ctx.currentTime, p = Math.max(0, Math.min(1, (now - t0) / total));
  el.querySelector('line').setAttribute('x1', 6 + p * 228);
  el.querySelector('line').setAttribute('x2', 6 + p * 228);
  el.querySelectorAll('rect').forEach(r => r.classList.toggle('on', now >= times[+r.dataset.i]));
  if(now < t0 + total + .4){ requestAnimationFrame(tick); }
  else { resetCard(mel.id); current = null; }
}

// ---- 音の形（ピアノロール） ----
function roll(mel){
  const total = mel.notes.reduce((s, n) => s + n[1], 0);
  const ms = mel.notes.filter(n => n[0] !== null).flatMap(n => [].concat(n[0]));
  const lo = Math.min(...ms) - 2, hi = Math.max(...ms) + 2;
  let t = 0, rects = '';
  mel.notes.forEach(([m, b], i) => {
    if(m !== null){
      const x = 6 + t / total * 228, w = Math.max(1.5, b / total * 228 - 1.5);
      [].concat(m).forEach(p => {
        const y = 54 - (p - lo) / (hi - lo) * 46;
        rects += `<rect data-i="${i}" x="${x.toFixed(1)}" y="${(y - 3).toFixed(1)}" width="${w.toFixed(1)}" height="6" rx="${Math.min(3, w / 2).toFixed(1)}"/>`;
      });
    }
    t += b;
  });
  return `<svg class="roll" viewBox="0 0 240 60" role="img" aria-label="${mel.name}の音の高さと長さ">${rects}<line x1="6" x2="6" y1="4" y2="56"/></svg>`;
}

function melodyData(mel){
  const layers = mel.layers ? `, layers:${JSON.stringify(mel.layers)}` : '';
  return `{ name:'${mel.name}', bpm:${mel.bpm}, tone:'${mel.tone}'${mel.echo ? ', echo:true' : ''}, notes:${JSON.stringify(mel.notes)}${layers} }`;
}
// 貼るだけで鳴る部品：音色のプログラム＋メロディーのデータ
function snippet(list){
  const names = list.map(m => `//   ${m.id}  …  ${m.name}`).join('\n');
  const data = list.map(m => `  '${m.id}': ${melodyData(m)}`).join(',\n');
  return `// ===== メロディー部品（Web Audio API・外部ファイル不要）=====
// 入っているメロディー:
${names}
//
// 使いかた:
//   ボタンをタップしたときの処理の中で  playMelody('${list[0].id}')  と呼ぶ。
//   （iPad/iPhoneは、タップの中で最初に鳴らさないと音が出ないことがある）
//   戻り値の total は曲の長さ（秒）。止めたいときは stopMelody()。

let ctx = null, bus = null, noiseBuf = null;
${unlock.toString()}
const hz = ${hz.toString()};
${partial.toString()}
${noise.toString()}
${drumHit.toString()}
${layered.toString()}
${voice.toString()}
${startMelody.toString()}

const MELODIES = {
${data}
};
function playMelody(id){ return startMelody(MELODIES[id]); }
function stopMelody(){
  if(bus && ctx){ const b = bus; b.gain.setTargetAtTime(0, ctx.currentTime, .03); setTimeout(() => b.disconnect(), 300); bus = null; }
}
`;
}
function copyText(text, msgEl){
  const done = () => { msgEl.textContent = 'コピーしたよ'; setTimeout(() => msgEl.textContent = '', 2000); };
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e){ msgEl.textContent = 'コピーできなかったよ'; }
    ta.remove();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, fallback); }
  else fallback();
}

const grid = document.getElementById('grid');
MELODIES.forEach(mel => {
  const sec = (mel.notes.reduce((s, n) => s + n[1], 0) * 60 / mel.bpm).toFixed(1);
  const card = document.createElement('article');
  card.className = 'card'; card.dataset.id = mel.id;
  card.innerHTML = `
    <div class="head">
      <div class="pic" aria-hidden="true">${ICONS[mel.icon]}</div>
      <div><p class="name">${mel.name}</p><p class="meta">${R(TONE_NAME[mel.tone])}・やく${sec}秒</p></div>
    </div>
    ${roll(mel)}
    <div><p class="label">イメージ</p><p class="text">${R(mel.image)}</p></div>
    <div><p class="label">{使|つか}うとき</p><p class="text">${R(mel.use)}</p></div>
    ${mel.voice ? `<div class="opt">
      <label for="name-${mel.id}">おなまえ</label>
      <input type="text" id="name-${mel.id}" class="name-in" value="" placeholder="なまえをいれてね" maxlength="12" autocomplete="off">
      <label class="chk" for="voice-${mel.id}"><input type="checkbox" id="voice-${mel.id}" class="voice-on" checked>こえもいれる</label>
    </div>` : ''}
    <div class="row">
      <button class="play" type="button" id="play-${mel.id}">きいてみる</button>
      <button class="copy copy-parts" type="button" id="copy-${mel.id}">{部|ぶ}{品|ひん}をコピー</button>
    </div>
    <p class="msg copy-msg" aria-live="polite"></p>`;
  card.querySelectorAll('.label').forEach(l => l.innerHTML = R(l.innerHTML));
  card.querySelector('.play').addEventListener('click', () => play(mel));
  card.querySelectorAll('.copy').forEach(b => b.innerHTML = R(b.innerHTML));
  card.querySelector('.copy-parts').addEventListener('click', () => copyText(snippet([mel]), card.querySelector('.copy-msg')));
  grid.appendChild(card);
});

// ---- よみあげカード：いれた文字をそのまま声でよむ ----
(function(){
  const card = document.createElement('article');
  card.className = 'card'; card.id = 'tts';
  card.innerHTML = R(`
    <div class="head">
      <div class="pic" aria-hidden="true">${ICONS.call}</div>
      <div><p class="name">よみあげ</p><p class="meta">いれた{文|も}{字|じ}を{声|こえ}でよむよ</p></div>
    </div>
    <div><p class="label">イメージ</p><p class="text">{書|か}いた{言|こと}{葉|ば}を、iPadやiPhoneに{入|はい}っている{声|こえ}でよみあげるよ。</p></div>
    <div class="opt col">
      <label for="tts-text">よむ{言|こと}{葉|ば}</label>
      <textarea id="tts-text" rows="3" maxlength="300" placeholder="ここに ことばを いれてね" autocomplete="off"></textarea>
    </div>
    <div class="opt col">
      <label for="tts-voice">{声|こえ}のしゅるい（★はきれいな{声|こえ}）</label>
      <select id="tts-voice"></select>
    </div>
    <div class="row">
      <button class="play" type="button" id="play-tts">よみあげる</button>
    </div>
    <p class="msg tts-msg" aria-live="polite"></p>`);
  grid.appendChild(card);
  fillVoiceSelect();

  const textIn = card.querySelector('#tts-text'), sel = card.querySelector('#tts-voice'),
        btn = card.querySelector('#play-tts'), msg = card.querySelector('.tts-msg');
  let speaking = false;
  const reset = () => { speaking = false; btn.textContent = 'よみあげる'; card.classList.remove('playing'); };

  sel.addEventListener('change', () => {
    const v = jaVoices.find(x => x.voiceURI === sel.value);
    if(v){ jaVoice = v; try { localStorage.setItem(VOICE_KEY, v.voiceURI); } catch(e){} }
  });
  btn.addEventListener('click', () => {
    if(speaking){ try { speechSynthesis.cancel(); } catch(e){} reset(); return; }
    const text = textIn.value.trim();
    if(!text){ msg.textContent = 'ことばをいれてね'; return; }
    if(!('speechSynthesis' in window)){ msg.textContent = 'このブラウザでは、よみあげができないよ。'; return; }
    msg.textContent = '';
    stopPlaying(); stopAll(); unlock();
    speaking = true; btn.textContent = 'とめる'; card.classList.add('playing');
    sayText(text, reset);
  });
})();

document.getElementById('copy-all').addEventListener('click', () => copyText(snippet(MELODIES), document.getElementById('copy-all-msg')));
</script>

</body>
</html>
